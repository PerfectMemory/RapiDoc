# Perfect Memory only: publishes @pm/rapidoc on the internal Nexus (npm-pm-public).
# This file lives on the release/pm branch and must never be part of the upstream PR.
include:
  - project: perfect-memory/platform/gitlab-ci-templates
    ref: release/v1
    file: files/templates/node-library.yml

# The repository is an npm workspaces monorepo (package-lock.json), not a yarn one: override the template install job.
# Only install @pm/rapidoc: a full "npm ci" links the bin of the other workspaces (rapidoc-cli) and fails with
# "EPERM: chmod" because the checkout is not owned by the CI user. The docs and the CLI are not published anyway.
install:
  extends: .install
  script:
    - npm ci --workspace=@pm/rapidoc --no-audit --no-fund

# Tag pipelines only ("v<version>", e.g. v10.1.0-pm.0): the version comes from the tag, whatever packages/rapidoc/package.json says.
# Release with "npm version <version>" at the repository root (commits, tags v<version>, pushes to the gitlab remote).
build:
  extends: .build
  needs:
    - job: install
      artifacts: true
  script:
    - npm pkg set version="${CI_COMMIT_TAG#v}" --workspace=@pm/rapidoc
    - npm run build:rapidoc
  artifacts:
    expire_in: 1d
    paths:
      - packages/rapidoc/dist

publish:
  extends: .publish
  needs:
    - job: build
      artifacts: true
  script:
    # Only dist/ is passed by the build job (not its package.json change): set the version from the tag again
    - npm pkg set version="${CI_COMMIT_TAG#v}" --workspace=@pm/rapidoc
    - cd packages/rapidoc
    # --tag next for prereleases (npm refuses to publish a prerelease as "latest" implicitly)
    - |
      case "$(node -p "require('./package.json').version")" in
        *-*) npm publish --tag next ;;
        *)   npm publish ;;
      esac
